version: "3.8"

services:
  fraud-api:
    build: .
    container_name: fraud-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./database.db:/app/database.db
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
      - ./reports:/app/reports
    restart: unless-stopped

  monitoring:
    build:
      context: .
      dockerfile: docker/monitoring.Dockerfile
    container_name: monitoring
    # Считаем дрейф раз в 5 минут на выборке 50k и держим /metrics на 9200.
    command: ["--mode", "serve", "--sample", "50000", "--interval", "30"]
    ports:
      - "9200:9200"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
      - ./reports:/app/reports
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
